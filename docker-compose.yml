version: '3.8'

# logiflow : serveur Rust (server-rs/), qui sert l'API et l'interface, applique
# les migrations au démarrage et lance les tâches de fond (sauvegardes, purge).

# Secrets lus dans le fichier .env (non versionné) à côté de ce fichier : voir
# .env.example et la section « Sécurité / variables obligatoires » du README.
x-logiflow-env: &logiflow-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-logiflow_admin}:${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}@logiflow-db:5432/${POSTGRES_DB:-logiflow_db}
  SESSION_SECRET: ${SESSION_SECRET:?Définissez SESSION_SECRET dans .env}
  # Clé de chiffrement des secrets en base, distincte de SESSION_SECRET
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
  # Mot de passe initial du compte admin (base vide uniquement ; sinon aléatoire, dans les journaux)
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  USE_LOCAL_AUTH: "true"
  POSTGRES_USER: ${POSTGRES_USER:-logiflow_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
  POSTGRES_DB: ${POSTGRES_DB:-logiflow_db}
  BACKUP_DIR: /app/backups
  # Clé(s) de l'API externe de rapprochement, lues depuis le .env de l'hôte (vide = API désactivée)
  EXTERNAL_API_KEYS: ${EXTERNAL_API_KEYS:-}
  # Origines acceptées en plus de l'adresse du site pour les écritures (décision R4)
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

services:
  logiflow:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      <<: *logiflow-env
      PORT: 3000
      RUST_LOG: info
    ports:
      - "3000:3000"
    networks:
      - nginx_default
    depends_on:
      logiflow-db:
        condition: service_healthy
    volumes:
      - backup_data:/app/backups
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  logiflow-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logiflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-logiflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    # Base non publiée sur l'hôte : seul le service logiflow y accède par le
    # réseau Docker. Pour un accès local ponctuel : "127.0.0.1:5434:5432"
    networks:
      - nginx_default
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  backup_data:
    driver: local

networks:
  nginx_default:
    external: true
